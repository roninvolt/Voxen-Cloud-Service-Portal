name: Voxen Cloud Services CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ==========================================
  # 1. Test & Build Verification Job
  # ==========================================
  test-and-verify:
    name: Run Automated Tests & Verify Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Backend testing
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

      # Frontend testing & build
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

  # ==========================================
  # 2. Build & Push Docker Images Job
  # ==========================================
  build-and-push:
    name: Build & Push Container Images
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/voxen-backend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/voxen-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/voxen-frontend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_REGISTRY }}/voxen-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 3. SSH Deploy to Cloud Server Job
  # ==========================================
  deploy-to-server:
    name: SSH Deploy to Cloud Server (AWS EC2 / Ubuntu)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy Over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "==== Starting Voxen Cloud Services Deployment ===="
            cd /opt/voxen

            # Pull latest code or docker-compose configuration
            echo "Pulling latest changes..."
            git pull origin main || true

            # Export deployment environment tags
            export DOCKER_REGISTRY="${{ env.DOCKER_REGISTRY }}"
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"

            # Log into registry on target server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull images
            echo "Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull

            # Re-create and restart containers with zero-downtime
            echo "Deploying new containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Health Check Verification
            echo "Running Health Check Verification on http://localhost/api/health..."
            HEALTH_STATUS="failed"
            for i in {1..12}; do
              if curl -s -f http://localhost/api/health | grep -q '"status":"ok"'; then
                echo "Health check PASSED on attempt $i"
                HEALTH_STATUS="passed"
                break
              fi
              echo "Waiting for services to initialize... (attempt $i/12)"
              sleep 5
            done

            if [ "$HEALTH_STATUS" != "passed" ]; then
              echo "ERROR: Health check failed! Rolling back or checking logs..."
              docker compose -f docker-compose.prod.yml logs --tail 50 backend
              exit 1
            fi

            # Clean up old unused images
            docker image prune -af --filter "until=72h"

            echo "==== Voxen Cloud Services Successfully Deployed! ===="
