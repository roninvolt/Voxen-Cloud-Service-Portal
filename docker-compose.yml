services:
  postgres:
    image: postgres:15-alpine
    container_name: voxen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-docmanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuser} -d ${POSTGRES_DB:-docmanager}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - voxen-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voxen-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-docuser}:${POSTGRES_PASSWORD:-devpassword123}@postgres:5432/${POSTGRES_DB:-docmanager}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIR: /app/uploads
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - voxen-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voxen-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - voxen-network

  nginx:
    image: nginx:alpine
    container_name: voxen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - voxen-network

volumes:
  postgres_data:
    name: voxen_postgres_data
  backend_uploads:
    name: voxen_backend_uploads

networks:
  voxen-network:
    name: voxen_network
    driver: bridge
